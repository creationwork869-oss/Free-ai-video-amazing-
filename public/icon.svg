<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="fintechBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#070c1a"/>
      <stop offset="100%" stop-color="#03060d"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="120" fill="url(#fintechBg)"/>
  <rect width="504" height="504" x="4" y="4" rx="116" fill="none" stroke="url(#emeraldGrad)" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Radial ambient glow -->
  <circle cx="256" cy="256" r="150" fill="url(#emeraldGrad)" opacity="0.15" filter="url(#glowEffect)"/>

  <!-- Security Shield & UPI Symbol -->
  <g filter="url(#glowEffect)">
    <!-- Shield Outline -->
    <path d="M256 90 L380 145 C380 270 256 375 256 375 C256 375 132 270 132 145 Z" fill="#0c1630" stroke="url(#emeraldGrad)" stroke-width="6"/>
    
    <!-- Indian Rupee (₹) Symbol in Gold -->
    <text x="256" y="280" font-family="'Inter', sans-serif" font-weight="900" font-size="160" fill="url(#goldGrad)" text-anchor="middle">₹</text>

    <!-- Super Cashback Sparkle Stars -->
    <polygon points="370,120 376,134 390,136 379,146 382,160 370,152 358,160 361,146 350,136 364,134" fill="#34d399"/>
    <polygon points="140,320 144,330 155,332 146,340 149,350 140,344 131,350 134,340 125,332 136,330" fill="#fbbf24"/>
  </g>
  
  <!-- "SUPER CASHBACK" Pill Bottom -->
  <rect x="120" y="405" width="272" height="42" rx="21" fill="url(#emeraldGrad)"/>
  <text x="256" y="432" font-family="'Inter', sans-serif" font-weight="800" font-size="18" fill="#04121a" letter-spacing="2" text-anchor="middle">SUPER CASHBACK</text>
</svg>
